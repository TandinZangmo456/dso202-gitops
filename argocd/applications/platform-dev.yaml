# =============================================================================
# File        : argocd/applications/platform-dev.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit IV 4.3.1 - Application CRDs; 4.3.2 - sync policies
# Purpose     : Delivers the platform objects of the dev environment: the
#               namespace, ResourceQuota, LimitRange, Role and RoleBinding from
#               Assignment 2, and the sealed credentials from Task 4.
# Staging     : argocd/applications/platform-staging.yaml is identical except
#               for the name, the path (platform/staging), and the destination
#               namespace (dso202-staging).
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-dev
  namespace: argocd
  annotations:
    # Wave -1: after the Sealed Secrets controller (wave -2), before the
    # workloads (wave 0).
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://github.com/TandinZangmo456/dso202-gitops.git
    targetRevision: main
    # A plain directory of manifests: no chart, no templating.
    path: platform/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dso202-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The SealedSecret kind is registered by the controller installed in the
      # previous wave. If the platform Application is evaluated before that
      # registration is visible, this option lets the sync proceed instead of
      # failing the dry run, and the retry below covers any remaining gap.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
