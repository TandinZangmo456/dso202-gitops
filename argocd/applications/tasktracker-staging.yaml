# =============================================================================
# File        : argocd/applications/tasktracker-staging.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit IV 4.3.1 (Application CRDs), 4.3.2 (sync policies)
# Purpose     : Deploys the Task Tracker Helm chart to the staging environment.
#               Staging is pinned to a Git tag and changes only when a person
#               triggers a sync.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasktracker-staging
  namespace: argocd
  labels:
    dso202/environment: staging
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dso202

  source:
    repoURL: https://github.com/TandinZangmo456/dso202-gitops.git
    # Staging tracks an immutable reference: a tag created on main (Task 5).
    # A tag always resolves to the same commit, so this Application cannot
    # change meaning until a commit edits this line. Promotion to staging is
    # therefore a reviewed change to this value, followed by a manual sync.
    targetRevision: v1.0.0
    path: charts/tasktracker
    helm:
      releaseName: tasktracker
      valueFiles:
        - ../../environments/staging/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dso202-staging

  # No 'automated' block: Argo CD still compares the cluster with Git
  # continuously and reports OutOfSync, but applies nothing until a person
  # synchronises. This is the approval gate between dev and staging.
  syncPolicy:
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
