# =============================================================================
# File        : argocd/applications/sealed-secrets.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit IV 4.2.2 - Helm repositories; 4.3.1 - Application CRDs
# Purpose     : Installs the Sealed Secrets controller from its public Helm
#               repository. The controller holds the private key that decrypts
#               the SealedSecret objects committed to Git.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    # Wave -2: the controller and its CustomResourceDefinition must exist before
    # any SealedSecret is applied.
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    # A Helm repository source uses 'chart' where a Git source uses 'path'.
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    # Chart version, pinned exactly. The chart version (2.20.0) differs from
    # the controller version (0.40.0); the upstream project documents this.
    targetRevision: 2.20.0
    helm:
      releaseName: sealed-secrets
      # Inline values. The kubeseal command-line tool looks for a controller
      # named 'sealed-secrets-controller' unless told otherwise, whereas the
      # chart's default name is 'sealed-secrets'. Overriding the name here
      # removes the need for an extra flag on every kubeseal command.
      valuesObject:
        fullnameOverride: sealed-secrets-controller

  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Creates the sealed-secrets namespace if it does not exist.
      - CreateNamespace=true
    # A failed sync is retried with exponential backoff: 10s, 20s, 40s, ... up
    # to three minutes between attempts, five attempts in total.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
