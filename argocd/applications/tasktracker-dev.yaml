# =============================================================================
# File        : argocd/applications/tasktracker-dev.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit IV 4.3.1 (Application CRDs), 4.3.2 (sync policies),
#               4.3.3 (health checks); Unit III 3.2 (Helm)
# Purpose     : Deploys the Task Tracker Helm chart to the dev environment.
#               Dev follows the tip of main and heals itself automatically.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasktracker-dev
  namespace: argocd
  labels:
    dso202/environment: dev
  annotations:
    # Wave 0: after the platform layer (wave -1) is Healthy, which includes the
    # namespace existing and the sealed credentials having been decrypted.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dso202

  source:
    repoURL: https://github.com/TandinZangmo456/dso202-gitops.git
    # Dev tracks a moving reference: every merge to main is deployed.
    targetRevision: main
    path: charts/tasktracker
    helm:
      # Fixed release name, so that object names are identical in every
      # environment; the namespace is what distinguishes them.
      releaseName: tasktracker
      # Paths are relative to the chart directory (charts/tasktracker), so two
      # levels up reaches the repository root.
      valueFiles:
        - ../../environments/dev/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dso202-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
