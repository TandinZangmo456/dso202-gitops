# =============================================================================
# File        : argocd/applications/tasktracker-dev.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit IV 4.3.1 (Application CRDs), 4.3.2 (sync policies),
#               4.3.3 (health checks); Unit III 3.2 (Helm)
# Purpose     : Deploys the Task Tracker Helm chart to the dev environment.
#               Dev follows the tip of main and heals itself automatically.
#               Task 10: multi-source. The chart and the values file are
#               separate sources, so values could later move to their own
#               repository without changing the chart source.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasktracker-dev
  namespace: argocd
  labels:
    dso202/environment: dev
  annotations:
    # Wave 0: after the platform layer (wave -1) is Healthy, which includes the
    # namespace existing and the sealed credentials having been decrypted.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dso202

  # "sources" replaces "source"; an Application may not have both.
  sources:
    # Source 1: the chart. Dev tracks main, so every merge is deployed.
    - repoURL: https://github.com/TandinZangmo456/dso202-gitops.git
      targetRevision: main
      path: charts/tasktracker
      helm:
        # Fixed release name, so that object names are identical in every
        # environment; the namespace is what distinguishes them.
        releaseName: tasktracker
        # $values is the root of source 2, so the path starts at the repo
        # root instead of "../../" from the chart directory.
        valueFiles:
          - $values/environments/dev/values.yaml
    # Source 2: the same repository, used only as a source of values files.
    # It has no path, so it renders nothing on its own.
    - repoURL: https://github.com/TandinZangmo456/dso202-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: dso202-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
