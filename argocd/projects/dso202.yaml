# =============================================================================
# File        : argocd/projects/dso202.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit IV 4.4.1 - AppProjects: source and destination rules
# Purpose     : The workload project. It confines the Task Tracker Applications
#               to one repository, two namespaces, and an explicit list of
#               resource kinds. A manifest outside these limits is rejected at
#               sync time, whoever committed it.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dso202
  namespace: argocd
  annotations:
    # Wave -3: the project must exist before any Application that refers to it.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  description: Task Tracker workloads for the dev and staging environments

  sourceRepos:
    - https://github.com/TandinZangmo456/dso202-gitops.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: dso202-dev
    - server: https://kubernetes.default.svc
      namespace: dso202-staging

  # An empty list permits no cluster-scoped kinds at all: this project cannot
  # create namespaces, ClusterRoles, or CustomResourceDefinitions.
  clusterResourceWhitelist: []

  # Only these namespaced kinds may be deployed. The list is built from the
  # output of 'helm template' (Task 3) and must name exactly the kinds the chart
  # renders, including the Job used as a hook. ResourceQuota, LimitRange, Role,
  # RoleBinding, and SealedSecret are absent on purpose: they belong to the
  # platform layer, so the workload project cannot loosen its own limits.
  #
  # Changes from Listing 8, so the list matches 'helm template' exactly:
  #   - StatefulSet and ServiceAccount removed: my chart renders neither (the
  #     database is a Deployment with a PersistentVolumeClaim).
  #   - PersistentVolumeClaim added (below).
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    # Added: the chart renders the database volume claim (templates/db-pvc.yaml).
    - group: ""
      kind: PersistentVolumeClaim
    - group: batch
      kind: Job
