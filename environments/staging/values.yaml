# =============================================================================
# File        : environments/staging/values.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit III 3.2 - Helm values; Unit IV 4.3.1 - Application CRDs
# Purpose     : Everything that differs in staging from charts/tasktracker/values.yaml.
#               Read by argocd/applications/tasktracker-staging.yaml at a Git
#               tag, so editing this file on main changes nothing in staging
#               until the tag is moved forward and a person syncs.
# =============================================================================
environment: staging

# Contract C3: the Secret created by the Sealed Secrets controller from
# platform/staging/tasktracker-credentials.sealed.yaml (sealed separately).
credentials:
  existingSecret: tasktracker-credentials

database:
  image:
    tag: "1.0"

backend:
  image:
    tag: "1.0"
  replicaCount: 1               # one replica per tier to save memory

frontend:
  image:
    tag: "1.0"
  replicaCount: 1
  service:
    nodePort: 30081             # contract C10: not mapped by kind; reached with kubectl port-forward
