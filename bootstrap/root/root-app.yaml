# =============================================================================
# File        : bootstrap/root/root-app.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit IV 4.3.1 - Application CRDs; app-of-apps bootstrap pattern
# Apply with  : kubectl apply -f bootstrap/root
# Purpose     : The only Application created by hand. It watches the argocd/
#               directory of the repository, which contains every other
#               AppProject and Application. Adding a file there creates an
#               Application; removing one deletes it.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd

  # With this finalizer, deleting this Application also deletes the
  # resources it created (here: the child Applications, which in turn
  # delete theirs). Without it, deletion would leave them behind.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://github.com/TandinZangmo456/dso202-gitops.git
    # The root follows the main branch. In a team, every file under argocd/
    # would reach main only through a reviewed pull request, because a merge
    # here creates or deletes Applications.
    targetRevision: main
    path: argocd
    directory:
      # argocd/ contains two subdirectories: projects/ and applications/.
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    # The child Application objects themselves live in the argocd namespace.
    namespace: argocd

  syncPolicy:
    automated:
      # prune: an Application removed from Git is removed from the cluster.
      prune: true
      # selfHeal: an Application edited in the cluster is restored from Git.
      selfHeal: true
    # A failed sync is retried with exponential backoff. During a rebuild
    # (Task 9) the root can fail while the controller it depends on is still
    # starting; the retry lets it recover without manual intervention.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
