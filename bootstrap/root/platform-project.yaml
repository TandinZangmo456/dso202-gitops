# =============================================================================
# File        : bootstrap/root/platform-project.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit IV 4.4.1 - AppProjects: source and destination rules
# Apply with  : kubectl apply -f bootstrap/root
# Purpose     : The administrative project. It owns the root Application, the
#               Sealed Secrets controller, and the per-environment platform
#               objects (namespaces, quotas, credentials).
#
# This project is deliberately broad, and it is applied by hand because it must
# exist before the root Application can be created. The upstream documentation
# describes creating Applications in arbitrary projects as an administrator
# capability, and warns that a project allowed to deploy into the Argo CD
# namespace has effectively administrator rights. Only this project is allowed
# to target the 'argocd' namespace.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform layer - administrator level, applied by hand during bootstrap

  # Repositories this project may read from. The repository URL must be written
  # identically here and in every Application that uses it.
  sourceRepos:
    - https://github.com/TandinZangmo456/dso202-gitops.git
    - https://bitnami.github.io/sealed-secrets

  # Clusters and namespaces this project may deploy into.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: sealed-secrets
    - server: https://kubernetes.default.svc
      namespace: dso202-dev
    - server: https://kubernetes.default.svc
      namespace: dso202-staging

  # Cluster-scoped kinds (Namespace, CustomResourceDefinition, ClusterRole, ...)
  # are needed by the Sealed Secrets chart and by the namespace manifests.
  # Narrowing this list to the exact kinds required is an extension task.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
