# =============================================================================
# File        : platform/staging/namespace.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit I 1.5.1 - namespaces; Unit IV 4.3.2 - sync options
# Purpose     : The staging namespace, owned by the platform-staging
#               Application. Copied from platform/dev/namespace.yaml with the
#               name and the environment label changed.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: dso202-staging
  labels:
    dso202/assignment: "04"
    dso202/environment: staging
    dso202/managed-by: argocd
  annotations:
    # The platform-staging Application has pruning enabled. Without this
    # annotation, deleting this file from Git would delete the namespace and
    # everything inside it. 'Prune=false' tells Argo CD never to prune this
    # object, so removal requires a deliberate manual step.
    argocd.argoproj.io/sync-options: Prune=false
