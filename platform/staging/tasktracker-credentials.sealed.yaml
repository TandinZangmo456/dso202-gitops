# =============================================================================
# File        : platform/staging/tasktracker-credentials.sealed.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit IV 4.3.1; Unit II 2.3 - credentials as SealedSecrets
# Purpose     : The database credentials of the staging environment, encrypted with
#               kubeseal against this cluster's Sealed Secrets controller. Safe
#               to commit: only that controller can decrypt it. Strict scope:
#               the name (tasktracker-credentials) and namespace (dso202-staging)
#               are part of the encryption, so the file cannot be reused in
#               another namespace. Generated, not edited by hand (Task 4).
# =============================================================================
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tasktracker-credentials
  namespace: dso202-staging
spec:
  encryptedData:
    DB_PASSWORD: 
    DB_USER: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: tasktracker-credentials
      namespace: dso202-staging
