# =============================================================================
# File        : platform/staging/quota-and-limits.yaml
# Assignment  : DSO202 Assignment 4 (objects from Assignment 2)
# Descriptor  : Unit I 1.5.3 - resource quotas and limit ranges
# Purpose     : Caps what the Task Tracker may use in dso202-staging. Delivered by
#               the platform-staging Application, not by the chart (contract C8),
#               so the workload project cannot loosen its own limits.
# =============================================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: assignment-quota
  namespace: dso202-staging
  labels:
    app.kubernetes.io/part-of: task-tracker
spec:
  hard:
    requests.cpu: "500m"            # steady state 175m, leaves room for surge Pods
    requests.memory: 1Gi            # steady state 352Mi
    limits.cpu: "2"                 # steady state 850m, plus surge Pods
    limits.memory: 1536Mi           # steady state 704Mi, plus surge Pods
    pods: "10"                      # 3 running, plus rollout, smoke test or self-healing overlap
    persistentvolumeclaims: "2"     # only the database needs one
    requests.storage: 2Gi           # the database volume is 1Gi
    services.nodeports: "1"         # only the frontend may be a NodePort
    services.loadbalancers: "0"     # nothing may be a LoadBalancer
---
apiVersion: v1
kind: LimitRange
metadata:
  name: assignment-limits
  namespace: dso202-staging
  labels:
    app.kubernetes.io/part-of: task-tracker
spec:
  limits:
    - type: Container
      defaultRequest:               # applied if a container omits requests
        cpu: 50m
        memory: 64Mi
      default:                      # applied if a container omits limits
        cpu: 200m
        memory: 128Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:                          # the database is the largest container
        cpu: 500m
        memory: 512Mi
