# values.yaml - default configuration of the tasktracker chart.
# The defaults are the dev sizing. environments/prod.yaml overrides them.
# Override with -f <file> or --set <key>=<value>.

# Which environment this release is. No default on purpose: the chart
# refuses to render until dev or prod is chosen.
environment: ""

# Shared by all three images. Each tier sets its own repository and tag below
# (contract C1). IfNotPresent lets images loaded with 'kind load' be used.
image:
  pullPolicy: IfNotPresent

# Non-sensitive settings, rendered into the ConfigMap.
# DB_HOST and BACKEND_URL are not listed here: the templates build them from
# the Service names, so they can never point at the wrong Service.
config:
  dbName: tasktracker             # used for both DB_NAME and POSTGRES_DB
  dbPort: 5432
  appPort: 8080
  corsOrigin: "*"

# Database credentials (contract C3). The chart never renders a Secret. Pods
# read the Secret named here, which must have the keys DB_USER, DB_PASSWORD,
# POSTGRES_USER and POSTGRES_PASSWORD. In Assignment 4 it is created by the
# Sealed Secrets controller from platform/<env>/tasktracker-credentials.sealed.yaml.
credentials:
  existingSecret: tasktracker-credentials

# Per-tier settings. image.tag is the release: the environment values files
# override it, never a template (contract C1). extraEnv is a list of
# {name, value} pairs added to the container as they are (contract C2), so a
# new variable needs a values change only. The images are amd64 rebuilds of
# the tutor-issued 1.0 images, approved by the tutor for this laptop.
database:
  image:
    repository: penguintandinzangmo/dso202-db
    tag: "1.0"
  extraEnv: []
  # Contract C4. pg_isready checks that PostgreSQL accepts connections; the
  # variables are expanded by the shell inside the container.
  readinessProbe:
    exec:
      command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
    initialDelaySeconds: 5
    periodSeconds: 5
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    size: 1Gi
    storageClass: standard        # kind's default provisioner

backend:
  image:
    repository: penguintandinzangmo/dso202-backend
    tag: "1.0"
  extraEnv: []
  # Contract C4: /api/status returns 503 while the database is unreachable.
  readinessProbe:
    httpGet:
      path: /api/status
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  service:
    port: 8080                    # ClusterIP only; there is no setting to expose it

frontend:
  image:
    repository: penguintandinzangmo/dso202-frontend
    tag: "1.0"
  extraEnv: []
  # Contract C4: nginx serves the page.
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 2
    periodSeconds: 5
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  service:
    port: 8080
    nodePort: 30080               # must be mapped in kind-config.yaml

nameOverride: ""
fullnameOverride: ""
