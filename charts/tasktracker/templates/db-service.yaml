{{- $tier := dict "ctx" . "tier" "database" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tasktracker.dbName" . }}
  labels:
    {{- include "tasktracker.labels" $tier | nindent 4 }}
spec:
  clusterIP: None                 # headless; no setting can expose the database
  selector:
    {{- include "tasktracker.selectorLabels" $tier | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
