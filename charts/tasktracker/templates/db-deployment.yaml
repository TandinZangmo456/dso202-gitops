{{- $tier := dict "ctx" . "tier" "database" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tasktracker.dbName" . }}
  labels:
    {{- include "tasktracker.labels" $tier | nindent 4 }}
  annotations:
    # Contract C5: wave 0. Argo CD waits for the database to be Healthy
    # (readiness probe passing) before it applies the backend in wave 1.
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1                    # fixed: one ReadWriteOnce volume, one Pod
  strategy:
    type: Recreate                # the old Pod must release the volume first
  selector:
    matchLabels:
      {{- include "tasktracker.selectorLabels" $tier | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tasktracker.labels" $tier | nindent 8 }}
      annotations:
        # Changing the ConfigMap changes this hash, so the Pod template
        # changes and the Deployment rolls out.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: postgres
          image: {{ include "tasktracker.image" (dict "ctx" . "image" .Values.database.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # The official postgres image expects POSTGRES_*, not DB_*
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tasktracker.fullname" . }}-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tasktracker.secretName" . }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tasktracker.secretName" . }}
                  key: POSTGRES_PASSWORD
            {{- with .Values.database.extraEnv }}
            # Extra variables from values (contract C2)
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Contract C4: ready only when PostgreSQL accepts connections.
          readinessProbe:
            {{- toYaml .Values.database.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: {{ include "tasktracker.dbName" . }}-data
