{{- $tier := dict "ctx" . "tier" "frontend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tasktracker.frontendName" . }}
  labels:
    {{- include "tasktracker.labels" $tier | nindent 4 }}
  annotations:
    # Contract C5: wave 2, the last tier; it needs the backend to be ready.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  # Contract C6: report a stuck rollout after 120 seconds, not 600.
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      {{- include "tasktracker.selectorLabels" $tier | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tasktracker.labels" $tier | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: frontend
          image: {{ include "tasktracker.image" (dict "ctx" . "image" .Values.frontend.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # Rendered into config.js by the image's entrypoint at container start
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tasktracker.fullname" . }}-config
                  key: BACKEND_URL
            {{- with .Values.frontend.extraEnv }}
            # Extra variables from values (contract C2)
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Contract C4: ready when nginx serves the page.
          readinessProbe:
            {{- toYaml .Values.frontend.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
