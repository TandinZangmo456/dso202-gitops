{{- $tier := dict "ctx" . "tier" "frontend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-tracker.frontendName" . }}
  labels:
    {{- include "task-tracker.labels" $tier | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "task-tracker.selectorLabels" $tier | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "task-tracker.labels" $tier | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: frontend
          image: {{ include "task-tracker.image" (dict "ctx" . "image" .Values.frontend.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # Rendered into config.js by the image's entrypoint at container start
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "task-tracker.fullname" . }}-config
                  key: BACKEND_URL
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
