{{- $tier := dict "ctx" . "tier" "backend" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tasktracker.backendName" . }}
  labels:
    {{- include "tasktracker.labels" $tier | nindent 4 }}
spec:
  type: ClusterIP                 # fixed in the template; values cannot expose the backend
  selector:
    {{- include "tasktracker.selectorLabels" $tier | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
