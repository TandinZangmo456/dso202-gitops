apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tasktracker.dbName" . }}-data
  labels:
    {{- include "tasktracker.labels" (dict "ctx" . "tier" "database") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.database.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.database.persistence.size }}
