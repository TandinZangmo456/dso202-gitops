{{- /*
secret.yaml - created only when no existingSecret is given. The same user and
password are written under both naming conventions, so they cannot drift apart.
Base64 is encoding, not encryption, and Helm also keeps these values in its
release record (see README).
*/}}
{{- if not .Values.credentials.existingSecret }}
{{- $user := required "credentials.user must be set (pass -f environments/secrets.yaml)" .Values.credentials.user }}
{{- $password := required "credentials.password must be set (pass -f environments/secrets.yaml)" .Values.credentials.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-tracker.secretName" . }}
  labels:
    {{- include "task-tracker.commonLabels" . | nindent 4 }}
type: Opaque
data:
  DB_USER: {{ $user | b64enc | quote }}
  DB_PASSWORD: {{ $password | b64enc | quote }}
  POSTGRES_USER: {{ $user | b64enc | quote }}
  POSTGRES_PASSWORD: {{ $password | b64enc | quote }}
{{- end }}
